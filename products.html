
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Product</title>

  <style>
    /* Premium Section */
    .premium-section {
      padding: 60px 20px;
      background: linear-gradient(135deg, #ffd898, #ffbb77);
      display: flex;
      justify-content: center;
    }

    .premium-container {
      width: 90%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      gap: 40px;
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
    }

    /* Left Image */
    .premium-image img {
      width: 280px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Right Content */
    .premium-content h2 {
      font-size: 32px;
      font-weight: 700;
      color: #333;
    }

    .premium-content p {
      font-size: 18px;
      line-height: 1.6;
      margin: 15px 0;
      color: #444;
    }

    .premium-content ul {
      margin: 15px 0;
      padding-left: 20px;
      font-size: 17px;
      color: #555;
    }

    .premium-btn {
      margin-top: 20px;
      padding: 12px 30px;
      background: #ff8a00;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: .3s;
    }

    .premium-btn:hover {
      background: #e67500;
    }

    /* RESPONSIVE for Mobile */
    @media (max-width: 768px) {
      .premium-container {
        flex-direction: column;
        text-align: center;
      }

      .premium-image img {
        width: 220px;
      }
    }
    .glow-title {
  text-align: center;
  font-size: 40px;
  font-weight: 900;
  color: #ff8a00;
  text-shadow: 0 0 10px rgba(255, 136, 0, 0.6),
               0 0 20px rgba(255, 85, 0, 0.4);
  margin-bottom: 35px;
}
.underline-title {
  text-align: center;
  font-size: 38px;
  font-weight: 800;
  color: #333;
  position: relative;
  margin-bottom: 40px;
}

.underline-title::after {
  content: "";
  width: 120px;
  height: 5px;
  background: #ff8a00;
  display: block;
  margin: 8px auto 0;
  border-radius: 5px;
}


  </style>
</head>

<body>

  <!-- PREMIUM PRODUCT SECTION -->
  <section class="premium-section">
    <div class="premium-container">

      <!-- Left Side Image -->
      <div class="premium-image">
        <img src="majnoon.png" alt="Product">
      </div>

      <!-- Right Side Content -->
      <div class="premium-content">
        <h1 class="glow-title">MAJNOON</h1>
        <h1 class="underline-title">



        <p>
          Experience the rich, refreshing taste of our premium special drink.
          Made with fresh fruits, pure ingredients, and crafted with perfection.
        </p>

        <ul>
          <li>100% Natural Ingredients</li>
          <li>No Added Sugar</li>
          <li>Rich in Vitamins</li>
          <li>Perfect for Hot Days</li>
        </ul>

        
      </div>

    </div>
  </section>

</body>
</html>
